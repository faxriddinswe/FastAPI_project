<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing in… — PDP Education</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-base);
    }
    .box {
      text-align: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg), var(--glow);
    }
    .spinner-lg {
      width: 52px; height: 52px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-family: Outfit, sans-serif; font-size: 22px; margin-bottom: 8px; }
    p { color: var(--text-muted); font-size: 14px; }
    .error-icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="spinner-lg"></div>
    <h2>Signing you in…</h2>
    <p>Please wait while we verify your Google account.</p>
  </div>

  <script type="module">
    import { setAuth } from './assets/js/api.js';

    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const role   = params.get('role');
    const name   = params.get('name') || '';
    const userId = params.get('user_id');
    const error  = params.get('error');

    const box = document.getElementById('box');

    if (error) {
      const messages = {
        token_exchange_failed: 'Failed to exchange Google token. Please try again.',
        userinfo_failed: 'Could not retrieve your Google profile.',
        no_email: 'Google account has no email. Please use a different account.',
        account_disabled: 'Your account is disabled. Contact support.',
      };
      box.innerHTML = `
        <div class="error-icon">⚠️</div>
        <h2 style="color:var(--danger)">Sign-in Failed</h2>
        <p>${messages[error] || 'An unexpected error occurred.'}</p>
        <a href="/" class="btn btn-primary btn-full" style="margin-top:24px;display:inline-block">← Back to Login</a>
      `;
    } else if (token && role) {
      // Save auth data (same shape as normal login)
      setAuth({ access_token: token, role, full_name: decodeURIComponent(name), user_id: Number(userId) });

      const redirects = {
        admin:   '/pages/admin/dashboard.html',
        teacher: '/pages/teacher/dashboard.html',
        student: '/pages/student/dashboard.html',
      };
      window.location.href = redirects[role] || '/';
    } else {
      box.innerHTML = `
        <div class="error-icon">❌</div>
        <h2 style="color:var(--danger)">Something went wrong</h2>
        <p>No authentication token received.</p>
        <a href="/" class="btn btn-primary btn-full" style="margin-top:24px;display:inline-block">← Back to Login</a>
      `;
    }
  </script>
</body>
</html>
